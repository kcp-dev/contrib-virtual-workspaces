# marketplace-catalog - the registry of Provider records.
#
# Bound by hand into the catalog workspace and nowhere else. It carries no
# claims: a Provider record is data, and the tier holding the records that
# say who may publish cannot reach into any workspace.
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: marketplace-catalog
spec:
  resources:
    - name: providers
      group: marketplace.contrib.kcp.io
      schema: v260924-7813b03.providers.marketplace.contrib.kcp.io
      storage:
        crd: {}
