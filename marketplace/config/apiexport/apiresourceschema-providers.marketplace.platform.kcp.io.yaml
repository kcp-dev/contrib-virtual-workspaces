apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260924-7813b03.providers.marketplace.platform.kcp.io
spec:
  group: marketplace.platform.kcp.io
  names:
    kind: Provider
    listKind: ProviderList
    plural: providers
    singular: provider
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      description: |-
        Provider is the registration record: it says which workspace is allowed
        to publish offerings under this name. It lives in the catalog workspace
        and grants nothing by existing — the reach into a provider workspace
        comes from the marketplace-publish binding there, never from this
        record.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: ProviderSpec is the desired state of a Provider.
          properties:
            description:
              description: Description is free text for humans.
              type: string
            displayName:
              description: DisplayName is the human name of the provider, shown in
                the catalog.
              minLength: 1
              type: string
            mode:
              description: Mode is provisioned or external.
              enum:
              - provisioned
              - external
              type: string
            workspacePath:
              description: |-
                WorkspacePath is the canonical path of the provider's own workspace,
                for mode external. Ignored for mode provisioned, where the operator
                computes it.
              type: string
          required:
          - displayName
          - mode
          type: object
        status:
          description: ProviderStatus is the observed state of a Provider.
          properties:
            message:
              type: string
            phase:
              description: |-
                Phase describes where a marketplace object is in its lifecycle. It is a
                coarse, human-first signal; Message carries the detail when a phase is
                not Ready.
              type: string
            url:
              description: URL is the direct address of the provider's workspace,
                when known.
              type: string
            workspace:
              description: |-
                Workspace is the name of the provisioned Workspace object, for mode
                provisioned.
              type: string
            workspaceCluster:
              description: |-
                WorkspaceCluster is the logical cluster backing the provider's
                workspace. For external providers it is learned when the first
                Offering is published from that workspace.
              type: string
            workspacePath:
              description: |-
                WorkspacePath is the canonical path of the provider's workspace —
                computed for provisioned, copied from spec for external. Offerings
                bind against it.
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
