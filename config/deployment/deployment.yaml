apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: access-vw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-vw
    spec:
      serviceAccountName: access-vw
      initContainers:
        - name: init
          image: ghcr.io/kcp-dev/contrib-access-vw:latest
          imagePullPolicy: IfNotPresent
          command: ["/access-vw-init"]
          args:
            - --kubeconfig=/etc/kcp/kubeconfig/kubeconfig
            # The APIExport and the ServiceAccount the server runs as land in
            # <prefix>:<controllers-workspace>. Both are configurable so this
            # can be dropped anywhere in an existing tree.
            - --workspace-prefix=root:access
            - --controllers-workspace=controllers
            # Add --create-workspaces when the mounted kubeconfig is a
            # kcp-admin one and the tree should be created. Without it, the
            # kubeconfig's current context is the target and must already
            # exist.
            # - --create-workspaces
            # The generated kubeconfig has to address kcp from where the
            # server runs, which is not necessarily the URL init used.
            # - --host-override=https://frontproxy.kcp-system.svc:6443
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp/kubeconfig
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: server
          image: ghcr.io/kcp-dev/contrib-access-vw:latest
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=9443
            - --tls-cert-file=/etc/access-vw/tls/tls.crt
            - --tls-private-key-file=/etc/access-vw/tls/tls.key
            - --requestheader-client-ca-file=/etc/access-vw/requestheader-ca/ca.crt
            - --kubeconfig=/etc/kcp/kubeconfig/kubeconfig
            - --apiexport-endpointslice=access.contrib.kcp.io
            - --endpoint-base=https://kcp.example.com/clusters/
          ports:
            - name: https
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp/kubeconfig
              readOnly: true
            - name: serving-cert
              mountPath: /etc/access-vw/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /etc/access-vw/requestheader-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: kubeconfig
          secret:
            secretName: access-vw-kubeconfig
        - name: serving-cert
          secret:
            secretName: access-vw-server
        - name: requestheader-ca
          secret:
            secretName: access-vw-requestheader-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-vw
---
apiVersion: v1
kind: Service
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: access-vw
  ports:
    - name: https
      port: 9443
      targetPort: https
