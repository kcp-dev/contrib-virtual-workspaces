apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: access-vw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-vw
    spec:
      serviceAccountName: access-vw
      initContainers:
        - name: init
          image: ghcr.io/kcp-dev/contrib-access-vw:latest
          imagePullPolicy: IfNotPresent
          command: ["/access-vw-init"]
          args:
            - --kubeconfig=/etc/kcp/kubeconfig/kubeconfig
            # The APIExport lands in <prefix>:<controllers-workspace>, and any
            # missing workspace along that path is created. Both halves are
            # configurable so this can be dropped anywhere in an existing tree.
            - --workspace-prefix=root:access
            - --controllers-workspace=controllers
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp/kubeconfig
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: server
          image: ghcr.io/kcp-dev/contrib-access-vw:latest
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=9443
            - --tls-cert-file=/etc/access-vw/tls/tls.crt
            - --tls-private-key-file=/etc/access-vw/tls/tls.key
            - --requestheader-client-ca-file=/etc/access-vw/requestheader-ca/ca.crt
            - --kubeconfig=/etc/kcp/kubeconfig/kubeconfig
            - --apiexport-endpointslice=access.contrib.kcp.io
            - --endpoint-base=https://kcp.example.com/clusters/
          ports:
            - name: https
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp/kubeconfig
              readOnly: true
            - name: serving-cert
              mountPath: /etc/access-vw/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /etc/access-vw/requestheader-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        # The kcp credential, shared by init and the server. Both compute their
        # own workspace URL from --workspace-prefix / --controllers-workspace, so
        # it may point at any workspace and neither can be aimed at one the other
        # did not use.
        #
        # Produced by kcp-operator's Kubeconfig resource. init needs rights to
        # create workspaces from the root down and to install in the target
        # workspace; the server needs to read the APIExportEndpointSlice there
        # and reach apiexports/content.
        - name: kubeconfig
          secret:
            secretName: access-vw-kubeconfig
        - name: serving-cert
          secret:
            secretName: access-vw-server
        - name: requestheader-ca
          secret:
            secretName: access-vw-requestheader-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-vw
---
apiVersion: v1
kind: Service
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: access-vw
  ports:
    - name: https
      port: 9443
      targetPort: https
