# Applied into the STORE workspace: the registry of Tenant records.
#
# It binds the Tenant API and nothing else. In particular it does NOT bind
# tenancy-provisioner: no workspace is ever created here, so the capability
# to create one has no business being granted here. The records and the
# workspace tree they describe are deliberately different tiers.
apiVersion: apis.kcp.io/v1alpha2
kind: APIBinding
metadata:
  name: tenancy-platform
spec:
  reference:
    export:
      # The logical cluster id, not the pretty path: an APIBinding reference
      # resolves ids locally on the shard, while pretty paths need the cache
      # server's path index — which multi-shard deployments have broken
      # before. The WorkspaceTypes reference exports the same way.
      path: __EXPORTS_REF__
      name: tenancy-platform
