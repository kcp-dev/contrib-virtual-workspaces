apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260926-3d181e5.tenants.tenancy.platform.kcp.io
spec:
  group: tenancy.platform.kcp.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      description: |-
        Tenant asks for an isolated kcp workspace for one organizational unit.
        The operator provisions a workspace under the organization workspace the
        Tenant object lives in and reports it in Status.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: TenantSpec is the desired state of a Tenant.
          properties:
            description:
              description: Description is free text for humans.
              type: string
            displayName:
              description: |-
                DisplayName is the human name of the tenant. It seeds the workspace
                name (subject to the operator's naming strategy) and is returned in
                SelfTenancyReview answers. It is not required to be unique.
              type: string
            firstAdmin:
              description: |-
                FirstAdmin is an identity granted the admin role on this tenant once
                its workspace is ready, as a Membership the operator creates.

                It exists because a tenant nobody administers is unusable, and the
                two writes cannot be one: the Membership lives in the tenant's own
                workspace, which does not exist when the Tenant is created. Naming
                the admin here lets whoever creates the tenant hand it over without
                waiting, and is what makes self-service possible — the virtual
                workspace sets it to the caller, so a caller cannot make someone
                else the admin of a tenant they asked for.

                Empty means nobody is seeded, which is the right answer when an
                administrator intends to grant access separately.
              type: string
          required:
          - displayName
          type: object
        status:
          description: TenantStatus is the observed state of a Tenant.
          properties:
            message:
              type: string
            phase:
              description: |-
                Phase describes where a tenancy object is in its lifecycle. It is a
                coarse, human-first signal; Message carries the detail when a phase is
                not Ready.
              type: string
            url:
              description: URL is the direct address of the provisioned workspace.
              type: string
            workspace:
              description: |-
                Workspace is the name of the provisioned Workspace object, in the
                same workspace the Tenant lives in.
              type: string
            workspaceCluster:
              description: |-
                WorkspaceCluster is the logical cluster name backing the provisioned
                workspace. It is the stable address of the tenant's workspace.
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
