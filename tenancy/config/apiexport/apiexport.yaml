# The tenancy APIExport. An organization workspace binds this export to get
# the Tenant, Project and Membership resources; the permission claim below
# is what lets the operator create the tenant Workspace objects next to
# them.
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: tenancy.contrib.kcp.io
spec:
  resources:
    - name: tenants
      group: tenancy.contrib.kcp.io
      schema: v1alpha1.tenants.tenancy.contrib.kcp.io
      storage:
        crd: {}
    - name: projects
      group: tenancy.contrib.kcp.io
      schema: v1alpha1.projects.tenancy.contrib.kcp.io
      storage:
        crd: {}
    - name: memberships
      group: tenancy.contrib.kcp.io
      schema: v1alpha1.memberships.tenancy.contrib.kcp.io
      storage:
        crd: {}
  permissionClaims:
    - group: tenancy.kcp.io
      resource: workspaces
      verbs: [get, list, watch, create, update, patch, delete]
