apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260924-7813b03.projects.tenancy.platform.kcp.io
spec:
  group: tenancy.platform.kcp.io
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      description: |-
        Project asks for a workspace nested under a tenant's workspace. Projects
        are the unit teams actually work in; tenant-wide Memberships reach every
        project, project Memberships reach one.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: ProjectSpec is the desired state of a Project.
          properties:
            description:
              description: Description is free text for humans.
              type: string
            displayName:
              description: |-
                DisplayName is the human name of the project; it seeds the workspace
                name the same way a tenant's does.
              type: string
            tenant:
              description: |-
                Tenant names the Tenant (in the same workspace) this project belongs
                to. The project's workspace is created under that tenant's workspace.
              type: string
          required:
          - displayName
          - tenant
          type: object
        status:
          description: ProjectStatus is the observed state of a Project.
          properties:
            message:
              type: string
            phase:
              description: |-
                Phase describes where a tenancy object is in its lifecycle. It is a
                coarse, human-first signal; Message carries the detail when a phase is
                not Ready.
              type: string
            url:
              description: URL is the direct address of the provisioned workspace.
              type: string
            workspace:
              description: |-
                Workspace is the name of the provisioned Workspace object, inside the
                tenant's workspace.
              type: string
            workspaceCluster:
              description: |-
                WorkspaceCluster is the logical cluster name backing the provisioned
                workspace.
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
