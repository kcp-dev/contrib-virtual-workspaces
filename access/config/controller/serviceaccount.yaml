# Identity the access virtual workspace runs as.
#
# The server authenticates to kcp as this ServiceAccount rather than with an
# admin kubeconfig: it lives in the same workspace as the APIExport, so its
# rights are scoped to what the indexer actually needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-vw-controller
  namespace: default
---
# Long-lived token for the ServiceAccount above. kcp populates .data.token,
# which init reads to build the server's kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: access-vw-controller-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: access-vw-controller
type: kubernetes.io/service-account-token
