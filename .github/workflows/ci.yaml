name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # tag=v6.5.0
        with:
          go-version-file: go.mod

      # gofmt, go vet (including the e2e build tag), the kcp Kubernetes fork
      # pin check, e2e manifest rendering, and go mod tidy -diff.
      - name: Verify
        run: make verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # tag=v6.5.0
        with:
          go-version-file: go.mod

      # Build tags and linter selection come from .golangci.yml, so this job
      # and `make lint` check exactly the same thing.
      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # tag=v9.3.0
        with:
          args: --timeout 10m

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # tag=v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

  # One e2e job per component. Each deploys its component the way a user
  # would — access and mcp through kcp-operator on a kind cluster, ephemeral
  # as local processes against a real kcp — and asserts that the result
  # serves.
  #
  # These jobs track moving branches (kcp-operator main, kcp main) on
  # purpose: a change on either side that breaks the pairing should show up
  # here rather than in someone's cluster. That means a job can go red
  # without anything in this repository having changed. That is the signal
  # it exists to give.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [access, mcp, ephemeral]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # tag=v6.5.0
        with:
          go-version-file: go.mod

      # On failure the scripts dump the relevant logs and object state before
      # tearing down, so the job log is self-contained.
      - name: Run e2e tests
        run: make test-e2e-${{ matrix.component }}
        env:
          # Only the ephemeral harness reads this. Set the KCP_IMAGE
          # repository variable to pin a tag when kcp main is broken and the
          # noise is not useful.
          KCP_IMAGE: ${{ vars.KCP_IMAGE || 'ghcr.io/kcp-dev/kcp:main' }}
