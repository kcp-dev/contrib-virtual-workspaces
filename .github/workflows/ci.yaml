name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gofmt and go vet, the latter including the e2e build tag so that the
      # tests cannot rot unnoticed between runs of the job below.
      - name: Verify
        run: make verify

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

  # Runs the documented walkthrough against a real kcp and asserts the things
  # only a wired-up deployment can show: that the shard resolved a URL the
  # provider published, that the answer came from a webhook and was never
  # stored, and that the consumer's identity survived the proxy hop.
  #
  # kcp comes from the image built off its main branch, because this component
  # depends on changes that are in no kcp release: the APIExport reference
  # controller, the endpoint shards selector, and identity forwarding. Tracking
  # a moving image means this job can go red without anything in this repository
  # having changed. That is the signal it exists to give -- it has already
  # caught one upstream regression on the day it landed.
  #
  # Set the KCP_IMAGE repository variable to pin a tag when main is broken and
  # the noise is not useful.
  e2e:
    runs-on: ubuntu-latest
    # kcp, the virtual workspace and the webhook all have to come up, and the
    # referenced endpoint slice has to reach the cache server, before the first
    # assertion runs.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # On failure the script prints the tail of every process log plus any
      # "failed to retrieve virtual workspace URL" lines, so the job log is
      # self-contained after the processes are gone.
      - name: Run e2e tests
        run: make test-e2e
        env:
          KCP_IMAGE: ${{ vars.KCP_IMAGE || 'ghcr.io/kcp-dev/kcp:main' }}
